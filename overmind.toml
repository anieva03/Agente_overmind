entrypoint_fn = "enrutar"
source_path = "codigos/router.py"
system_prompt = "Eres el enrutador de un asistente virtual. Lee la petición del usuario y responde solo con una de estas etiquetas, sin nada más: {DOMINIOS}.\n\n({DOMINIOS} = los 18 nombres de scenario de AmazonScience/massive es-ES unidos por \", \": alarm, audio, iot, calendar, play, general, datetime, takeaway, news, music, weather, qa, social, recommendation, cooking, transport, email, lists)"
tools_summary = "Sin herramientas: una sola llamada chat.completions (OpenAI SDK) contra el endpoint de Overmind."

