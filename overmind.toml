[[capabilities.router-asistente.eval_matrix]]
name = "Etiqueta de dominio correcta"
type = "llm_judge_custom"
managed_name = ""
measures = "Si la salida es una única etiqueta válida de MASSIVE que corresponde al dominio de la petición."
rubric = "Se te da una petición de usuario en español y la salida de un enrutador. Dominios válidos: alarm, audio, iot, calendar, play, general, datetime, takeaway, news, music, weather, qa, social, recommendation, cooking, transport, email, lists. PASS si y solo si: (1) la salida es exactamente una de esas etiquetas, en minúsculas, sin texto, comillas ni puntuación adicional; y (2) es el dominio más apropiado para la petición (si hay expected_output, debe coincidir con él). FAIL si la salida está vacía, contiene explicación, es un sinónimo/traducción ('tiempo' en vez de 'weather'), está fuera de la lista o elige un dominio incorrecto (p. ej. music en lugar de play para 'pon canciones de X')."
requires_reference = false
rationale = "Protege el criterio central de éxito y los fallos de formato y confusión entre dominios próximos."

