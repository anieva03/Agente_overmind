base-url = "https://api.overmindlab.ai"
project-id = "9ee0d160-8fe3-45e2-b51c-b3cba3ce8127"
project-name = "agente_overmind"
repo_summary = "Práctica de Overmind: un enrutador de intenciones en español para un asistente virtual. codigos/router.py clasifica cada petición del usuario en uno de los 18 dominios (scenarios) del dataset AmazonScience/massive (es-ES) mediante una única llamada chat-completions a un modelo 'profesor' (MODELO_PROFESOR) servido a través del endpoint compatible OpenAI de Overmind, instrumentado con overmind.init/overmind.run/overmind.deliver. codigos/crear_eval.py genera eval_router.jsonl (300 filas input/expected_output del split test) y codigos/clase_mas_frecuente.py calcula la línea base de clase mayoritaria; ambos son scripts deterministas sin LLM."
trace-provider = "overmind"
version = "0.2.1"

